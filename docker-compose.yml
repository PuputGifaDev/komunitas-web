version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: internet_club_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: internet_club
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internet_club_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internet_club_api
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: internet_club
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: your_secret_key_change_in_production
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./server.js:/app/server.js
      - ./middleware:/app/middleware
      - ./utils:/app/utils
    networks:
      - internet_club_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internet_club_network:
    driver: bridge
