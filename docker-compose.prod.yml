version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: internet_club_db_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - internet_club_network_prod
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internet_club_api_prod
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    networks:
      - internet_club_network_prod
    restart: always

volumes:
  postgres_data_prod:

networks:
  internet_club_network_prod:
    driver: bridge
